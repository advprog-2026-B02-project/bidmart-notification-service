services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bidmart_notifications
      POSTGRES_USER: bidmart
      POSTGRES_PASSWORD: bidmart
    ports:
      - "5432:5432"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidmart-notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - APP_BASE_URL=http://notification-service:8086
      - APP_FRONTEND_URL=http://frontend:3000
      - USER_SERVICE_URL=http://auth-service:8081
      - BIDDING_SERVICE_URL=http://bidding-service:8082
      - CATALOG_SERVICE_URL=http://catalog-service:8083
      - WALLET_SERVICE_URL=http://wallet-service:8084
      - ORDER_SERVICE_URL=http://order-service:8085
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started
    ports:
      - "8086:8086"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: notification-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: notification-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bidmart_notifications
      POSTGRES_USER: bidmart
      POSTGRES_PASSWORD: bidmart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidmart -d bidmart_notifications"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidmart-notification-service
    env_file:
      - path: .env
        required: false
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/bidmart_notifications}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-bidmart}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-bidmart}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-notification-service}
      - KAFKA_NOTIFICATION_TOPIC=${KAFKA_NOTIFICATION_TOPIC:-order.notification-requests}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-service-secret}
      - APP_BASE_URL=${APP_BASE_URL:-http://notification-service:8086}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://frontend:3000}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://auth-service:8081}
      - BIDDING_SERVICE_URL=${BIDDING_SERVICE_URL:-http://bidding-service:8082}
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://catalog-service:8083}
      - WALLET_SERVICE_URL=${WALLET_SERVICE_URL:-http://wallet-service:8084}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8085}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8086:8086"

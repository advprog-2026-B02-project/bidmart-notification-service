spring:
  application:
    name: bidmart-notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-xxxxx-xxxxx-12345.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DATABASE_USERNAME:neondb_owner}
    password: ${DATABASE_PASSWORD:your-neon-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8086

app:
  base-url: ${APP_BASE_URL:http://localhost:8086}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  service-token: ${SERVICE_TOKEN:internal-service-secret}
  kafka:
    notification-topic: ${KAFKA_NOTIFICATION_TOPIC:order.notification-requests}
  client:
    user-url: ${USER_SERVICE_URL:http://localhost:8081}
    bidding-url: ${BIDDING_SERVICE_URL:http://localhost:8082}
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8083}
    wallet-url: ${WALLET_SERVICE_URL:http://localhost:8084}
    order-url: ${ORDER_SERVICE_URL:http://localhost:8085}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-please}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

---
spring:
  config:
    activate:
      on-profile: prod
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      auto-offset-reset: latest
      properties:
        retry.backoff.ms: 1000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    admin:
      fail-fast: false
      properties:
        retries: 10
        retry.backoff.ms: 1000
        request.timeout.ms: 30000
        default.api.timeout.ms: 60000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  port: 8086

app:
  base-url: ${APP_BASE_URL:http://notification-service:8086}
  frontend-url: ${APP_FRONTEND_URL:http://frontend:3000}
  service-token: ${INTERNAL_SERVICE_TOKEN:${SERVICE_TOKEN:internal-service-secret}}
  kafka:
    notification-topic: ${KAFKA_NOTIFICATION_TOPIC:order.notification-requests}
  client:
    user-url: ${USER_SERVICE_URL:http://auth-service:8081}
    bidding-url: ${BIDDING_SERVICE_URL:http://bidding-service:8082}
    catalog-url: ${CATALOG_SERVICE_URL:http://catalog-service:8083}
    wallet-url: ${WALLET_SERVICE_URL:http://wallet-service:8084}
    order-url: ${ORDER_SERVICE_URL:http://order-service:8085}

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: notification-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:h2:mem:bidmart_notification_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
